name: update-openreadest

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if versions are unchanged'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-openreadest
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve versions
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          # Latest upstream OpenReadest release
          $rel = gh api repos/luyishui/OpenReadest/releases/latest | ConvertFrom-Json
          if (-not $rel) { throw 'Failed to query luyishui/OpenReadest latest release' }
          $tag = $rel.tag_name
          $ver = $tag -replace '^[vV]', ''
          if ($ver -notmatch '^[\w.\-+_]+$') { throw "Unexpected upstream version derived from tag: $tag" }
          $asset = @($rel.assets) | Where-Object { $_.name -match '_x64-setup\.exe$' } | Select-Object -First 1
          if (-not $asset) { throw "No *_x64-setup.exe asset found in upstream release $tag" }

          $current = ''
          if (Test-Path 'bucket/openreadest.json') {
              $current = (Get-Content 'bucket/openreadest.json' -Raw | ConvertFrom-Json).version
          }
          $force = ('${{ inputs.force }}' -eq 'true')
          $skip = ($ver -eq $current) -and -not $force

          Write-Host "OpenReadest: $ver (tag $tag)"
          Write-Host "Asset      : $($asset.name)"
          Write-Host "Target     : $ver | manifest: $current$(if ($skip) { ' -> up to date, skipping' })"

          function out([string]$k, [string]$v) {
              [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "$k=$v`n")
          }
          out 'skip'   ($skip.ToString().ToLower())
          out 'ver'    $ver
          out 'tag'    $tag
          out 'url'    $asset.browser_download_url
          out 'fname'  $asset.name
          out 'digest' "$($asset.digest)"

      - name: Download and verify
        if: steps.ver.outputs.skip != 'true'
        id: dl
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $dl = Join-Path $env:RUNNER_TEMP 'dl'
          New-Item -ItemType Directory -Force -Path $dl | Out-Null
          $setup = Join-Path $dl 'setup.exe'

          Write-Host "Downloading ${{ steps.ver.outputs.url }}"
          Invoke-WebRequest -Uri '${{ steps.ver.outputs.url }}' -OutFile $setup
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $digest = '${{ steps.ver.outputs.digest }}'
          if ($digest -and $digest -ne "sha256:$sha") {
              throw "setup.exe digest mismatch: upstream says $digest, downloaded sha256:$sha"
          }
          if ($digest) { Write-Host "setup.exe sha256:$sha (matches upstream digest)" }
          else { Write-Host "setup.exe sha256:$sha (no upstream digest published, recorded)" }

          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "asset_sha=$sha`n")

      - name: Extract
        if: steps.ver.outputs.skip != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $sevenZip = Get-Command '7z' -CommandType Application -ErrorAction SilentlyContinue
          if (-not $sevenZip) {
              $fallback = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
              if (Test-Path $fallback) { $sevenZip = Get-Item $fallback }
          }
          if (-not $sevenZip) { throw '7-Zip (7z) not found on runner' }
          $sevenZipPath = if ($sevenZip -is [IO.FileInfo]) { $sevenZip.FullName } else { $sevenZip.Source }

          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null

          $setup = Join-Path $env:RUNNER_TEMP 'dl\setup.exe'
          Write-Host "Extracting $setup -> $stage"
          & $sevenZipPath x $setup "-o$stage" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed with exit code $LASTEXITCODE" }

          # Drop NSIS installer internals, keep only the app payload
          Get-ChildItem $stage -Force |
              Where-Object { $_.Name -in @('$PLUGINSDIR', '$TEMP', 'uninstall.exe') } |
              Remove-Item -Recurse -Force

          if (-not (Test-Path (Join-Path $stage 'openreadest.exe'))) { throw 'openreadest.exe missing after extraction' }
          if (-not (Test-Path (Join-Path $stage 'openreadest_thumbnail.dll'))) { throw 'openreadest_thumbnail.dll missing after extraction' }

          Write-Host 'Stage contents:'
          Get-ChildItem $stage -Force | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Smoke test
        if: steps.ver.outputs.skip != 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          $exe = Get-Item (Join-Path $stage 'openreadest.exe')
          $dll = Get-Item (Join-Path $stage 'openreadest_thumbnail.dll')

          # VersionInfo.FileVersion is inherited from upstream Readest and does not
          # track the release version, so assert identity instead of the version number.
          Write-Host "ProductName=$($exe.VersionInfo.ProductName) FileVersion=$($exe.VersionInfo.FileVersion) size=$($exe.Length)"
          if ($exe.VersionInfo.ProductName -ne 'OpenReadest') { throw "unexpected ProductName: $($exe.VersionInfo.ProductName)" }
          if ($exe.Length -lt 10MB) { throw "openreadest.exe is suspiciously small ($($exe.Length) bytes)" }
          if ($dll.Length -lt 100KB) { throw "openreadest_thumbnail.dll is suspiciously small ($($dll.Length) bytes)" }

      - name: Package
        if: steps.ver.outputs.skip != 'true'
        id: pkg
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.ver.outputs.ver }}'
          $tag = '${{ steps.ver.outputs.tag }}'
          $stage = Join-Path $env:RUNNER_TEMP 'stage'

          # Ship the upstream license text with the redistributed package (AGPL-3.0)
          $licUrl = "https://raw.githubusercontent.com/luyishui/OpenReadest/$tag/LICENSE"
          Write-Host "Downloading $licUrl"
          Invoke-WebRequest -Uri $licUrl -OutFile (Join-Path $stage 'LICENSE.txt')
          try {
              Invoke-WebRequest -Uri "https://raw.githubusercontent.com/luyishui/OpenReadest/$tag/NOTICE.md" -OutFile (Join-Path $stage 'NOTICE.md') -ErrorAction Stop
          } catch {
              Write-Host "NOTICE.md unavailable upstream ($($_.Exception.Message)), packaging without it"
          }

          $zip = Join-Path $env:RUNNER_TEMP "openreadest-$ver.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }

          Add-Type -AssemblyName System.IO.Compression.ZipFile -ErrorAction SilentlyContinue
          [IO.Compression.ZipFile]::CreateFromDirectory($stage, $zip, [IO.Compression.CompressionLevel]::Optimal, $false)

          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $zip).Length
          Write-Host "openreadest-$ver.zip  $size bytes  sha256:$sha"

          $zipObj = [IO.Compression.ZipFile]::OpenRead($zip)
          try { $entries = @($zipObj.Entries | ForEach-Object FullName) } finally { $zipObj.Dispose() }
          foreach ($required in @('openreadest.exe', 'openreadest_thumbnail.dll', 'LICENSE.txt')) {
              if ($entries -notcontains $required) { throw "invalid zip layout: $required not at zip root" }
          }
          if ($entries -match '^(\$PLUGINSDIR|\$TEMP|uninstall\.exe)') {
              throw 'invalid zip layout: NSIS installer internals leaked into the package'
          }
          Write-Host "zip layout OK ($($entries.Count) entries, root-flat)"

          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "zip=$zip`nsha=$sha`n")

      - name: Publish release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $ver = '${{ steps.ver.outputs.ver }}'
          $tag = '${{ steps.ver.outputs.tag }}'
          $fname = '${{ steps.ver.outputs.fname }}'
          $assetSha = '${{ steps.dl.outputs.asset_sha }}'
          $zip = '${{ steps.pkg.outputs.zip }}'
          $sha = '${{ steps.pkg.outputs.sha }}'
          $repo = '${{ github.repository }}'
          $relTag = "openreadest-v$ver"

          $notes = @'
          ## OpenReadest {0} (portable, windows-x64)

          - Upstream release: https://github.com/luyishui/OpenReadest/releases/tag/{1}
          - Repackaged from upstream installer `{2}` (sha256: {3}) by 7-Zip extraction
          - Zip layout (root): openreadest.exe, openreadest_thumbnail.dll, LICENSE.txt, NOTICE.md
          - Portable: no UAC, no registry changes, no file associations (the stock installer registers those)
          - Requires the Microsoft Edge WebView2 Runtime (preinstalled on Windows 11 and up-to-date Windows 10)
          - License: AGPL-3.0, source: https://github.com/luyishui/OpenReadest
          - SHA256: {4}

          Install with Scoop:

              scoop bucket add scoop-epubcheck https://github.com/{5}
              scoop install openreadest
          '@ -f $ver, $tag, $fname, $assetSha, $sha, $repo

          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notesFile -Value $notes -Encoding utf8NoBOM

          if (gh release view $relTag 2>$null) {
              Write-Host "Release $relTag already exists, refreshing assets and notes"
              gh release upload $relTag $zip --clobber
              if ($LASTEXITCODE -ne 0) { throw "gh release upload failed (exit $LASTEXITCODE)" }
              gh release edit $relTag --notes-file $notesFile
              if ($LASTEXITCODE -ne 0) { throw "gh release edit failed (exit $LASTEXITCODE)" }
          } else {
              # --latest=false keeps the EPUBCheck release as the repository's latest
              gh release create $relTag $zip --title "OpenReadest $ver" --notes-file $notesFile --latest=false
              if ($LASTEXITCODE -ne 0) { throw "gh release create failed (exit $LASTEXITCODE)" }
          }
          Write-Host "Published https://github.com/$repo/releases/tag/$relTag"

      - name: Update manifest
        if: steps.ver.outputs.skip != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.ver.outputs.ver }}'
          $sha = '${{ steps.pkg.outputs.sha }}'
          $url = "https://github.com/${{ github.repository }}/releases/download/openreadest-v$ver/openreadest-$ver.zip"
          $p = 'bucket/openreadest.json'

          $lines = Get-Content $p
          # Only rewrite the four-space-indented top-level fields; the eight-space
          # autoupdate.url template must keep its $version placeholder.
          $lines = $lines -replace '^(    "version":\s*")[^"]*(")', "`${1}$ver`${2}"
          $lines = $lines -replace '^(    "url":\s*")[^"]*(")', "`${1}$url`${2}"
          $lines = $lines -replace '^(    "hash":\s*")[^"]*(")', "`${1}sha256:$sha`${2}"
          $lines | Set-Content $p -Encoding utf8NoBOM

          $m = Get-Content $p -Raw | ConvertFrom-Json
          if ($m.version -ne $ver) { throw "manifest version not updated (got $($m.version))" }
          if ($m.url -ne $url) { throw 'manifest url not updated' }
          if ($m.hash -ne "sha256:$sha") { throw 'manifest hash not updated' }
          if ($m.autoupdate.url -notlike '*$version*') { throw 'autoupdate url template was clobbered' }
          Write-Host "Manifest updated to $ver"
          Get-Content $p | Write-Host

      - name: Commit manifest
        if: steps.ver.outputs.skip != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $ver = '${{ steps.ver.outputs.ver }}'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/openreadest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
              Write-Host 'Manifest unchanged, nothing to commit'
              exit 0
          }
          git commit -m "openreadest: update to $ver"
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          git push
          if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
